name: Secure Cluster Access (JIT)

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Name of the cluster you want to access (e.g., dev-lab-1)'
        required: true
        type: string
      developer_ip:
        description: 'Your public IP address (e.g., 203.0.113.45). Find it at ifconfig.me'
        required: true
        type: string

jobs:
  grant-access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Kubeconfig from GCS
        run: |
          echo "Fetching keys for cluster: ${{ inputs.cluster_name }}"
          gsutil cp gs://${{ secrets.GCP_STATE_BUCKET }}/${{ inputs.cluster_name }}/auth/kubeconfig ./kubeconfig
          chmod 600 ./kubeconfig

      - name: Install OpenShift CLI (oc)
        run: |
          wget -q https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz
          tar xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/

      - name: Whitelist Developer IP via OpenShift and GCP
        env:
          KUBECONFIG: ./kubeconfig
          DEV_IP: ${{ inputs.developer_ip }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: |
          echo "Applying network patches for IP: $DEV_IP"

          # 1. Patch the API Server Firewall via gcloud
          # The API LB is a static GCP asset created by the installer, so we must use gcloud.
          echo "Patching API Server Firewall..."
          API_RULE=$(gcloud compute firewall-rules list --filter="name~'${CLUSTER_NAME}.*api$'" --format="value(name)")
          if [ ! -z "$API_RULE" ]; then
            gcloud compute firewall-rules update $API_RULE --source-ranges="${DEV_IP}/32"
            echo "Successfully updated API firewall: $API_RULE"
          else
            echo "Error: Could not find API firewall rule."
            exit 1
          fi

          # 2. Patch the Ingress Controller (Web Console - Port 443) via oc
          # OpenShift actively reconciles this, so we use oc patch. We must include scope: External.
          echo "Patching Ingress Controller..."
          cat <<EOF > patch-ingress.json
          {"spec":{"endpointPublishingStrategy":{"type":"LoadBalancerService","loadBalancer":{"scope":"External","allowedSourceRanges":["${DEV_IP}/32"]}}}}
          EOF
          
          oc patch ingresscontroller default -n openshift-ingress-operator --type=merge --patch-file patch-ingress.json

          echo "======================================================"
          echo "SUCCESS! Access granted."
          echo "Wait ~3 minutes for the Load Balancers to update."
          echo "======================================================"